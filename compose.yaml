services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: ${CINEMA_DB_PASSWORD:-cinema-dev}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cinema
      SPRING_DATASOURCE_USERNAME: cinema
      SPRING_DATASOURCE_PASSWORD: ${CINEMA_DB_PASSWORD:-cinema-dev}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      CINEMA_ADMIN_TOKEN: ${CINEMA_ADMIN_TOKEN:-}
    ports:
      - "127.0.0.1:${CINEMA_BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    develop:
      watch:
        - action: rebuild
          path: ./src/main
        - action: rebuild
          path: ./gradle
        - action: rebuild
          path: ./gradlew
        - action: rebuild
          path: ./build.gradle.kts
        - action: rebuild
          path: ./settings.gradle.kts
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./.dockerignore

  frontend:
    build: ./frontend
    init: true
    environment:
      VITE_BACKEND_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:${CINEMA_FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(response => { if (!response.ok) process.exitCode = 1 })"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - Dockerfile
            - .dockerignore
            - package.json
            - pnpm-lock.yaml
        - action: rebuild
          path: ./frontend/Dockerfile
        - action: rebuild
          path: ./frontend/.dockerignore
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml

volumes:
  postgres-data:
